title: "Yiran Liu | Condensed Matter Physics"
name: "Yiran Liu"
description: "Research in superconductivity and magnetism by Yiran Liu at the Tsung-Dao Lee Institute."
url: https://lyrrrrrr.github.io
baseurl: ""
repository: "Lyrrrrrr/Lyrrrrrr.github.io"
locale: "en-US"
timezone: Etc/UTC

author:
  name: "Yiran Liu"
  github: "Lyrrrrrr"

include:
